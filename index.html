<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>joinp.com</title>

    <style>
        :root {
            --bg: #020617;
            --fg: #e5e7eb;
            --muted: #94a3b8;
            --accent: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
            Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 520px;
            padding: 2rem;
            animation: fadeUp 1s ease forwards;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--muted);
            opacity: 0;
            animation: fadeUp 0.8s ease forwards;
            animation-delay: 0.2s;
        }

        .dot {
            color: var(--accent);
            animation: pulse 2s infinite;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: var(--accent);
            margin: 2rem auto;
            border-radius: 2px;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards;
            animation-delay: 0.4s;
        }

        footer {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: var(--muted);
            opacity: 0;
            animation: fadeUp 0.8s ease forwards;
            animation-delay: 0.6s;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        footer a.contact {
            color: var(--fg);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        footer a.contact:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

    </style>
</head>
<body>
<main class="container">
    <h1>joinp<span class="dot">.</span></h1>

    <p>
        Podríamos construir algo aquí
    </p>

    <div class="divider"></div>

    <footer>
        © 2026 joinp.com ·
        <a href="#" id="contactEmail" class="contact">
        </a>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const user = 'german';
            const domain = 'joinp.com';
            const emailLink = document.getElementById('contactEmail');
            if (emailLink) {
                emailLink.href = 'mailto:' + user + '@' + domain;
                emailLink.textContent = user + '@' + domain;
            }
        });
    </script>
</main>
</body>
</html>

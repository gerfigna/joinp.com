name: Microdatos ETL

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  microdatos-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run ETL downloader
        run: node microdatos-etl/download-microdatos.js

      - name: Upload ETL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dgt-microdatos-etl
          path: microdatos-etl/data
          if-no-files-found: error

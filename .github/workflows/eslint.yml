name: eslint

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: microdatos-etl
        run: npm install
      - name: Run ESLint
        working-directory: microdatos-etl
        run: npm run lint
